<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container min-vh-100 d-flex flex-column justify-content-center align-items-center py-4">
        <div class="text-center mb-4 w-100">
            <h1 class="display-4 mb-3">Pomodoro Timer</h1>

            <!-- Exam Notification Area -->
            <div id="examNotification" class="mb-4"></div>

            <!-- Focus Mode Status -->
            <div id="focusStatus" class="alert alert-info d-none" role="alert">
                <i class="fas fa-moon"></i> Focus Mode Active - Notifications Blocked
            </div>

            <!-- Notification Control -->
            <div class="mb-3">
                <button id="toggleNotifications" class="btn btn-outline-secondary">
                    <i class="fas fa-bell"></i> Block Notifications
                </button>
            </div>

            <!-- Timer Settings -->
            <div class="timer-settings mb-4">
                <div class="row justify-content-center g-3">
                    <div class="col-6 col-sm-4">
                        <label for="workDuration" class="form-label">Work Duration (min)</label>
                        <input type="number" class="form-control" id="workDuration" value="25" min="1" max="60">
                    </div>
                    <div class="col-6 col-sm-4">
                        <label for="breakDuration" class="form-label">Break Duration (min)</label>
                        <input type="number" class="form-control" id="breakDuration" value="5" min="1" max="30">
                    </div>
                </div>
            </div>

            <div class="mode-indicator mb-3">
                <span id="currentMode" class="badge bg-primary fs-5">Work Time</span>
            </div>
            <div class="timer-display mb-4">
                <span id="minutes" class="display-1">25</span>
                <span class="display-1">:</span>
                <span id="seconds" class="display-1">00</span>
            </div>

            <div class="progress mb-4" style="height: 10px;">
                <div id="progressBar" class="progress-bar" role="progressbar" style="width: 100%"></div>
            </div>

            <!-- Add pause statistics display -->
            <div id="pauseStats" class="mb-3"></div>

            <div class="session-counter mb-3">
                Session: <span id="sessionCount">0</span>
                <!-- Add reward message container -->
                <div id="rewardMessage" class="reward-message mt-2"></div>
            </div>

            <div class="controls mb-4">
                <button id="startBtn" class="btn btn-success btn-lg me-2">Start</button>
                <button id="pauseBtn" class="btn btn-warning btn-lg me-2" disabled>Pause</button>
                <button id="resetBtn" class="btn btn-danger btn-lg">Reset</button>
            </div>

            <!-- Task Management Section -->
            <div class="card mt-4">
                <div class="card-header">
                    <h5 class="card-title mb-0">Task Manager</h5>
                </div>
                <div class="card-body">
                    <form id="todoForm" class="mb-3" data-edit-mode="false">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <input type="text" class="form-control" id="taskTitle" placeholder="Task Title" required>
                            </div>
                            <div class="col-md-2">
                                <select class="form-select" id="taskPriority">
                                    <option value="low">Low</option>
                                    <option value="medium" selected>Medium</option>
                                    <option value="high">High</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <input type="datetime-local" class="form-control" id="taskDueDate">
                            </div>
                            <div class="col-md-2">
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="fas fa-plus"></i> Add Task
                                </button>
                            </div>
                        </div>
                    </form>
                    <div class="task-container">
                        <ul id="taskList" class="list-group">
                            <!-- Task items will be added here dynamically -->
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Exam Management Section -->
            <div class="card mt-4">
                <div class="card-header">
                    <h5 class="card-title mb-0">Manage Exams</h5>
                </div>
                <div class="card-body">
                    <form id="examForm" class="mb-3">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <input type="text" class="form-control" id="examSubject" placeholder="Exam Subject" required>
                            </div>
                            <div class="col-md-4">
                                <input type="date" class="form-control" id="examDate" required>
                            </div>
                            <div class="col-md-2">
                                <button type="submit" class="btn btn-primary w-100">Add</button>
                            </div>
                        </div>
                    </form>
                    <ul id="examList" class="list-group">
                        <!-- Exam items will be added here dynamically -->
                    </ul>
                </div>
            </div>



            <!-- Enhanced Reminders Section -->
            <div class="card mt-4">
                <div class="card-header">
                    <h5 class="card-title mb-0">Smart Reminders</h5>
                </div>
                <div class="card-body">
                    <!-- Health & Wellness Reminders -->
                    <div class="row mb-4">
                        <div class="col-12">
                            <h6 class="text-muted mb-3">Health & Wellness</h6>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Hydration Reminder</label>
                            <div class="input-group">
                                <input type="number" class="form-control" id="hydrationInterval" placeholder="30" min="5" max="120">
                                <span class="input-group-text">min</span>
                                <button class="btn btn-outline-primary" id="setHydration">Set</button>
                            </div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Eye Rest (20-20-20 Rule)</label>
                            <div class="input-group">
                                <input type="number" class="form-control" id="eyeRestInterval" placeholder="20" min="10" max="60">
                                <span class="input-group-text">min</span>
                                <button class="btn btn-outline-primary" id="setEyeRest">Set</button>
                            </div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Posture Check</label>
                            <div class="input-group">
                                <input type="number" class="form-control" id="postureInterval" placeholder="45" min="15" max="120">
                                <span class="input-group-text">min</span>
                                <button class="btn btn-outline-primary" id="setPosture">Set</button>
                            </div>
                        </div>
                    </div>

                    <!-- Daily Study Reminder -->
                    <div class="row mb-4">
                        <div class="col-12">
                            <h6 class="text-muted mb-3">Daily Study Schedule</h6>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Daily Study Time</label>
                            <div class="input-group">
                                <input type="time" class="form-control" id="dailyStudyTime">
                                <button class="btn btn-outline-primary" id="setDailyStudy">Set Reminder</button>
                            </div>
                        </div>
                    </div>

                    <!-- Custom Reminders -->
                    <div class="row mb-3">
                        <div class="col-12">
                            <h6 class="text-muted mb-3">Custom Reminders</h6>
                        </div>
                        <div class="col-md-4 mb-2">
                            <input type="text" class="form-control" id="customTitle" placeholder="Reminder Title">
                        </div>
                        <div class="col-md-4 mb-2">
                            <input type="text" class="form-control" id="customMessage" placeholder="Reminder Message">
                        </div>
                        <div class="col-md-2 mb-2">
                            <input type="number" class="form-control" id="customInterval" placeholder="30" min="1">
                        </div>
                        <div class="col-md-2 mb-2">
                            <button class="btn btn-success w-100" id="addCustomReminder">Add</button>
                        </div>
                    </div>

                    <!-- Active Reminders Display -->
                    <div class="row">
                        <div class="col-12">
                            <h6 class="text-muted mb-3">Active Reminders</h6>
                            <div id="activeReminders" class="alert alert-info">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span>No active reminders</span>
                                    <button class="btn btn-sm btn-outline-danger" id="clearAllReminders">Clear All</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <script src="{{ url_for('static', filename='js/audio.js') }}"></script>
    <script src="{{ url_for('static', filename='js/notifications.js') }}"></script>
    <script src="{{ url_for('static', filename='js/quotes.js') }}"></script>
    <script src="{{ url_for('static', filename='js/reflection.js') }}"></script>
    <script src="{{ url_for('static', filename='js/achievements.js') }}"></script>
    <script src="{{ url_for('static', filename='js/knowledge.js') }}"></script>
    <script src="{{ url_for('static', filename='js/exams.js') }}"></script>
    <script src="{{ url_for('static', filename='js/todo.js') }}"></script>
    <script src="{{ url_for('static', filename='js/timer.js') }}"></script>
    <script src="{{ url_for('static', filename='js/rewards.js') }}"></script>
</body>
</html>
